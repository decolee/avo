name: sql_agg
description: >-
  Receita por cliente e mes com ranking, em SQLite, sob igualdade exata do result
  set. O candidato evolui SQL: a consulta e o esquema fisico (indices, views,
  ANALYZE). Score = media geometrica de tres regimes: frio, quente e janela larga.

seed: seed
knowledge_base: kb
entrypoint: query.sql

evaluate:
  command: ["python3", "{target}/eval.py", "--workdir", "{workdir}"]
  cwd: "."
  timeout: 10m

baselines:
  command: ["python3", "{target}/eval.py", "--baselines"]

score:
  direction: maximize

agent:
  goal: |
    Otimize work/query.sql (e, se ajudar, work/setup.sql) para maximizar o score
    mantendo o result set EXATAMENTE igual ao contrato.

    Voce mexe em SQL, nao em Python. Dois arquivos:

      query.sql  a consulta medida. UM unico SELECT (pode abrir com WITH), com os
                 parametros nomeados :d0, :d1 e :top_n. Sem DDL, sem DML.
      setup.sql  DDL opcional executada ANTES da consulta: CREATE INDEX,
                 CREATE VIEW, ANALYZE. Nada que altere dados, e nada de
                 CREATE TABLE.

    O avaliador mede tres regimes sobre o mesmo banco congelado:

      frio    setup.sql + as quatro janelas trimestrais de 2024, num banco
              recem-copiado. Aqui o preco de criar indice aparece.
      quente  as mesmas quatro janelas, com o banco ja preparado. Aqui o
              beneficio do indice aparece.
      larga   2023 inteiro numa consulta so, com corte mais fundo. Pune o plano
              que so funciona em faixa curta.

    O numero maximizado e a media geometrica dos tres. Indice util sobe `quente`
    e `larga` mais do que afunda `frio`; indice do mundo inteiro afunda `frio` e
    nao volta. Uma mudanca que acelera um regime e regride outro perde para uma
    que melhora os tres modestamente.

    A correcao e decidida num banco separado e adversarial, consultado com QUATRO
    conjuntos de parametros diferentes — inclusive um que devolve zero linhas.
    Candidato incorreto vale ZERO, nao "um pouco menos".

  notes: |
    Antes de comecar:

      - kb/00-contrato.md e a verdade sobre o esquema, as colunas de saida e as
        regras de borda. Leia inteiro: a janela de datas e [:d0, :d1) com o fim
        EXCLUSIVO, `n_estornos` conta pedidos com estorno e nao linhas, e o
        ORDER BY (mes DESC, liquido_cents DESC, customer_id) faz parte do
        contrato — o gate compara linha a linha, na ordem.
      - kb/10-sqlite-plano-e-indices.md ensina a ler EXPLAIN QUERY PLAN neste
        banco e o que custa cada coisa. kb/20-medicao.md diz em qual delta
        acreditar.
      - O banco congelado NUNCA e alterado: cada medicao roda sobre uma copia, e
        a consulta abre a conexao em modo somente leitura.
      - Materializar o resultado numa tabela, embutir as datas, ou devolver
        sempre :top_n linhas passa longe do que este alvo mede. O gate recusa
        CREATE TABLE pelo nome e roda a consulta com quatro janelas diferentes.
      - Depois do gate, a consulta e conferida tambem no banco de performance,
        nas cinco janelas cronometradas: o result set tem que ser o mesmo la.
        Consulta que so acerta no banco pequeno -- data embutida, predicado
        sobre o tamanho da tabela, funcao `pragma_*` que le o caminho do
        arquivo -- vale ZERO. O tempo medido tem que ser o tempo de produzir
        o relatorio.
      - `./avo-eval` de dentro do run dir mede sem tocar no lineage. Use a
        vontade: uma avaliacao do seed custa ~12s.

# Declaracao de headroom, medida a mao e conferida pelo `avo-lab verify`.
#
# A checklist de `docs/TARGET_DESIGN.md` exige 3x a 8x de headroom distribuido em
# pelo menos 4 movimentos, com nenhum passando de 70% do ganho. Isso NAO e
# verificavel por maquina — precisa de alguem escrevendo versoes melhores e
# medindo. O que a maquina pode fazer e cobrar que o numero esteja declarado, e
# recusar o alvo quando ele nao alcanca a barra. Sem isso a exigencia vive so na
# prosa, e prosa nao reprova ninguem.
lab:
  headroom_medido: 4.78
  # MELHOR DEMONSTRADO por qualquer meio, nao a escada escrita a mao. A mao
  # subestima: a sonda de 100s superou a declaracao anterior em tres dos cinco
  # alvos, e uma fracao de sonda acima de 100% e prova de denominador errado.
  headroom_fonte: >-
    full de 8 passos no piloto (experiments/FASE2_SQL_AGG.md)
  movimentos: 7
  valido: true
  nota: >-
    quatro degraus mensuraveis, tres dentro do ruido
  # TARGET_DESIGN.md §3e — medido por experiments/ablacao/sonda.py
  sonda_100s_fracao: 0.73
  # §3f — medido por experiments/ablacao/piloto.py ANTES do experimento.
  piloto_cv: 0.042
  piloto_n_para_5pct: 11
  piloto_nota: >-
    5 sessoes de greedy com o avaliador funcionando: 4,55x +/- 0,193, US$ 1,57 e
    ~350s cada. Um full de 8 passos com janela 2: 4,78x, US$ 21,18, 2,4h, com
    plato no passo 4 e o supervisor disparando nos passos 7 e 8. A diferenca de
    5% entre os dois e o efeito que n=11 foi dimensionado para distinguir.
  sonda_100s_nota: >-
    uma sessao de 100s mediu 2,58x (1,678 -> 4,328) contra headroom de 4,25x: 49% do
    ganho disponivel. UNICO alvo do repositorio que passa em §3e tendo tambem
    headroom acima da barra — sobra metade do espaco para a busca disputar. E o
    alvo em que a proxima ablacao tem chance de medir alguma coisa.
